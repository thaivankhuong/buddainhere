[package]
name = "buddainhere"
version = "0.1.0"
description = "BuddaInHere - Wallpaper Phật A Di Đà"
authors = ["LotusDharma"]
edition = "2021"

[lib]
name = "buddainhere_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
dirs = "6"
base64 = "0.22"
image = "0.25"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
