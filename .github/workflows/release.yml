name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Phiên bản release (vd: v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Download Niệm Phật An Vui images
        run: npm run download:niemphatanvui

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
          releaseName: BuddaInHere ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
          releaseBody: |
            ## Cài đặt

            1. Tải **`BuddaInHere_*_x64-setup.exe`** (khuyên dùng) hoặc file `.msi`.
            2. Chạy installer và làm theo hướng dẫn.
            3. Mở app từ khay hệ thống (góc dưới phải màn hình).

            Xem [README](https://github.com/${{ github.repository }}/blob/main/README.md) để biết cách sử dụng chi tiết.

            ## Yêu cầu

            - Windows 10/11 (64-bit)
          releaseDraft: true
          prerelease: false
          args: --verbose
